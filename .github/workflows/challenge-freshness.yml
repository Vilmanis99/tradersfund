name: Challenge source freshness

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - content/data/challenges/**
      - content/data/challenge-watch.json
      - scripts/challenge-freshness.mjs
      - .github/workflows/challenge-freshness.yml

permissions:
  contents: read

jobs:
  recapture-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Report sources expiring within 14 days; fail on expired sources
        shell: bash
        run: node scripts/challenge-freshness.mjs --window 14 --strict | tee -a "$GITHUB_STEP_SUMMARY"

# Read-only reporting: no source-date refreshes, captures, commits or public change summaries.
# A failing run requests editorial recapture; it does not mean sources were checked online.
